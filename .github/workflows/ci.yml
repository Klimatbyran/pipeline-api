name: Continuous Integration

env:
  # Use docker.io for Docker Hub if empty
  REGISTRY: ghcr.io
  # github.repository as <account>/<repo>
  IMAGE_NAME: ${{ github.repository }}

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'k8s/**' # Avoid CI runs for updates inside k8s folder

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: 🛎️ Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Step 2: Extract and normalize repository name into lowercase (e.g., pipeline-api)
      - id: imagename
        uses: ASzc/change-string-case-action@v6
        with:
          string: ${{ github.repository }}

      # Step 3: Bump prerelease BEFORE build so the image tag is new.
      # Previously we built with the current package.json version (often already
      # deployed) then bumped afterward. Flux ImagePolicy keys on tag name, so
      # overwriting e.g. 0.6.1-rc.2 did not roll stage — leaving validate's
      # requireEmissionsPresence toggle sending a flag that Zod stripped.
      - name: 🎫 Bump prerelease version
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          npm version prerelease --preid=rc

      # Step 4: Read the version we just bumped to (tags the image Flux will pick up)
      - name: 📝 Get Current Version
        id: package-version
        uses: martinbeentjes/npm-get-version-action@main

      # Step 5: Login to Docker Registry (GHCR authentication)
      - name: 🔐 Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 6: Set up Docker Buildx (required for advanced Docker build features)
      - name: 🏗️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 7: Build and push Docker image under the new unique tag
      - name: 🔧 Build and push Docker Image
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lowercase }}:${{ steps.package-version.outputs.current-version }}
            ${{ env.REGISTRY }}/${{ steps.imagename.outputs.lowercase }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 8: Push the version bump only after the image exists (GITHUB_TOKEN
      # pushes do not re-trigger this workflow — intentional).
      - name: 📤 Push version bump
        run: |
          git pull --rebase origin main
          git push origin main
