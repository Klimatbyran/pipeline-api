apiVersion: batch/v1
kind: CronJob
metadata:
  name: pipeline-api-prune-runs
spec:
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Backstop for concurrencyPolicy: Forbid — without this, a Job that
      # never exits (e.g. Redis unreachable, see the script's own
      # MAX_RUNTIME_MS comment) blocks every future scheduled run forever,
      # since Forbid treats it as still "active". This bounds the Job's
      # total wall-clock time across all OnFailure restarts, guaranteeing
      # it eventually frees the concurrency lock no matter what's wrong.
      activeDeadlineSeconds: 600
      template:
        spec:
          restartPolicy: OnFailure
          containers:
            - name: prune-runs
              image: ghcr.io/klimatbyran/pipeline-api
              command: ["npm", "run", "prune-runs-by-company"]
              env:
                - name: REDIS_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: redis
                      key: redis-password
                - name: REDIS_HOST
                  value: redis-master.garbo-stage.svc.cluster.local
                - name: INTERNAL_SERVICE_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: env
                      key: INTERNAL_SERVICE_TOKEN
                - name: NODE_ENV
                  valueFrom:
                    secretKeyRef:
                      name: env
                      key: NODE_ENV
